            ctx.fillStyle = '#85c1e9';
            ctx.fillRect(x + ENGINE_WIDTH - 10 * TS, y - engineHeight - 10 * TS, 8 * TS, 8 * TS);
            
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(x + ENGINE_WIDTH - 3 * TS, y - engineHeight + 5 * TS, 3 * TS, 5 * TS);

            // two wheels under the engine
            drawWheel(x + 8 * TS, y - TS, rot);
            drawWheel(x + ENGINE_WIDTH - 8 * TS, y - TS, rot);
        }

        // A passenger coach, drawn with its center-bottom at (cx, cy) and rotated by ang
        function drawCoachAt(cx, cy, ang, rot = 0) {
            const ch = 20 * TS;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
            ctx.fillStyle = '#2e8b57';                                     // body
            ctx.fillRect(-COACH_W / 2, -ch, COACH_W, ch);
            ctx.fillStyle = '#1e6b43';                                     // lower stripe
            ctx.fillRect(-COACH_W / 2, -5 * TS, COACH_W, 3 * TS);
            ctx.fillStyle = '#d6eaf8';                                     // windows
            for (let k = 0; k < 3; k++) ctx.fillRect(-COACH_W / 2 + (4 + k * 9) * TS, -ch + 4 * TS, 6 * TS, 6 * TS);
            ctx.fillStyle = '#222';                                        // coupler towards the car in front
            ctx.fillRect(COACH_W / 2, -8 * TS, COACH_GAP, 2 * TS);
            drawWheel(-COACH_W / 2 + 7 * TS, -TS, rot);                    // two wheels under the coach
            drawWheel(COACH_W / 2 - 7 * TS, -TS, rot);
            ctx.restore();
        }

        // Run Train is enabled only when the train can actually move
        function updateRunButton() {
            const t = state.train;
            let ok;
            if (t.active) ok = false;                                             // already moving
            else if (t.stoppedAtOuter) ok = state.signals['YRYG_Outer'].state !== 0;
            else if (t.stoppedAtStarter) ok = state.signals['YR_Adv'].state === 2;
            else if (t.stoppedAtStr) ok = state.signals['YR_Adv'].state === 2 && state.signals['L1_Adv'].state !== 0;
            else if (t.hasStarted) ok = false;
            else ok = Object.values(state.signals).some(s => s.state !== 0);      // some signal has been given
            if (btnTrain.disabled !== !ok) btnTrain.disabled = !ok;
            // the direction cannot be changed while a train is moving
            btnUp.disabled = btnDown.disabled = !!t.active;
        }

        // BCB: cancels the line clear - the arrow stops flashing and resets
        function cancelArrow() {
            if (arrowResetTimeout) { clearTimeout(arrowResetTimeout); arrowResetTimeout = null; }
            arrowDisplay.classList.remove('arrow-flashing');
            arrowDisplay.style.color = '#555';
            state.isLCRUnlocked = false;
            btnLCR.classList.remove('active');
        }

        // --- Interaction Logic ---
        btnTrain.addEventListener('click', () => { startTrain(); updateRunButton(); });

        document.getElementById('btnLoopSignal').addEventListener('click', () => {
            if (parked) { showMessage('লুপ লাইনে একটি ট্রেন দাঁড়িয়ে আছে, তাই এখন লুপ ব্যবহার করা যাবে না'); return; }
            if (state.train.hasStarted) return;
            if (state.activeRoute !== 'loop1' || (state.loop.left !== 'steady' && state.loop.left !== 'flash')) {
                showMessage('প্রথমে লুপ লাইন ' + bn12(loopNo('left')) + ' ক্লিক করে সেট করুন');
                return;
            }
            state.loop.green = true;
            // Outer shows two yellow lamps, Home shows one yellow lamp
            state.signals['YRYG_Outer'].state = 4;
            state.signals['RYG_Home'].state = 1;
            drawDiagram();
        });

        // Loop Signal 2: after LCR line clear, the Loop 2 line (STR -> "/" -> Adv. Starter) turns green
        btnLoopSignal2.addEventListener('click', () => {
            if (!state.train.stoppedAtStr || state.loop.right === 'off') return;
            // (no LCR needed here - line clear is asked only for the Adv. Starter)
            state.loop2.greenA = true;
            state.signals['L1_Adv'].state = 1;   // loop STR shows yellow
            drawDiagram();
        });

        document.getElementById('btnStarter').addEventListener('click', () => {
            // Train waiting at the loop STR: yellow comes from Loop Signal 2, so Starter does nothing here
            if (state.train.stoppedAtStr) return;
            if (state.activeRoute !== 'main' || state.step < 1 || state.train.active) return;
            
            state.signals['RY_Starter'].state = 1; 
            // Stopping train already past Outer & Home: only Starter->Adv is cleared
            state.step = state.train.passedHome ? 6 : 2;
            if (state.signals['YR_Adv'].state === 2) {          // Adv. Starter was already given
                if (state.train.passedHome) state.step = 7; else mainAllGreen();
            }
            drawDiagram();
        });

        document.getElementById('btnAdvStarter').addEventListener('click', () => {
            if (!state.isLCRUnlocked) {
                alert("আগে LCR বাটনে ক্লিক করে গোপন নাম্বার দিন!");
                return;
            }

            // Train waiting at the loop STR: Adv. Starter gives green on STR (and on the Adv. Starter signal)
            if (state.train.stoppedAtStr) {
                if (state.signals['L1_Adv'].state !== 1) return;   // Loop Signal 2 (yellow) first
                state.signals['YR_Adv'].state = 2;      // loop STR stays yellow
                state.loop2.greenB = true;                          // line after Adv. Starter turns green
                arrowDisplay.classList.remove('arrow-flashing');
                arrowDisplay.style.color = '#28a745';
                drawDiagram();
                return;
            }

            if (state.train.active) return;
            // The Adv. Starter is independent: with line clear it turns green by itself, whatever the other signals show
            const mainReady = state.activeRoute === 'main' && state.step >= 2 && state.signals['RY_Starter'].state !== 0;
            if (!mainReady) {
                if (state.activeRoute !== 'main' && state.activeRoute !== 'none') return;
                state.signals['YR_Adv'].state = 2;
                arrowDisplay.classList.remove('arrow-flashing');
                arrowDisplay.style.color = '#28a745';
                drawDiagram();
                return;
            }
            
            if (state.train.passedHome) {
                // Stopping train already crossed Outer & Home: they stay RED.
                // Only Starter and Adv. Starter turn green (Starter must be set first).
                if (state.step < 6) return;
                // Starter stays YELLOW for a stopping train; only Adv. Starter turns green 
                state.signals['YR_Adv'].state = 2;     
                state.step = 7;
            } else {
                // Through Train: Turn ALL signals GREEN (and the whole line)
                state.signals['YRYG_Outer'].state = 3; 
                state.signals['RYG_Home'].state = 2;   
                state.signals['GYR_Home'].state = 2;
                state.signals['GYRY_Home'].state = 2;
                state.signals['RY_Starter'].state = 2; 
                state.signals['YR_Adv'].state = 2;     
                state.step = 3;
            }
            
            arrowDisplay.classList.remove('arrow-flashing');
            arrowDisplay.style.color = '#28a745';
            
            drawDiagram();
        });

        // Points are real track: when the direction changes their left / right swap sides, and a flashing one settles first
        function reorientPoints() {
            stopLoopTimers();
            const fin = (v) => v === 'flash' ? 'steady' : (v === 'flashOff' ? 'off' : v);
            return { left: fin(state.loop.right), right: fin(state.loop.left) };
        }
        function stopLoopTimers() {
            for (const side of ['left', 'right']) if (loopTimers[side]) { clearTimeout(loopTimers[side]); loopTimers[side] = null; }
        }
        // Both LCR panels back to neutral
        function clearPanelsUI() {
            for (const [a, b] of [[arrowDisplayR, btnLCR_R], [arrowDisplayL, btnLCR_L]]) {
                a.classList.remove('arrow-flashing'); a.style.color = '#555'; b.classList.remove('active');
            }
            if (arrowResetTimeout) { clearTimeout(arrowResetTimeout); arrowResetTimeout = null; }
        }
        // Up train = comes from the left (Up signals + right LCR panel); Down train = comes from the right (Down signals + left LCR panel)
        function applyDirectionUI(d) {
            DIR = d;
            arrowDisplay = (d === 'up') ? arrowDisplayR : arrowDisplayL;
            btnLCR = (d === 'up') ? btnLCR_R : btnLCR_L;
            floatingPanel.classList.toggle('inactive', d !== 'up');
            floatingPanelL.classList.toggle('inactive', d !== 'down');
            btnUp.classList.toggle('active', d === 'up');
            btnDown.classList.toggle('active', d === 'down');
        }

        // A train stands at the loop starter: keep it (and its signal) exactly as it is and start a fresh session for another train
        function parkLoopTrain(d) {
            stopLoopTimers();
            const snap = cloneState(state);
            snap.loop.left = 'off';   // the entry point is normal again once the train is parked
            parked = { dir: DIR, state: snap };
            clearPanelsUI();
            state = newState();
            applyDirectionUI(d);
            btnLoopSignal2.style.display = 'none';
            btnMainHome.disabled = false;
            drawDiagram();
        }

        // Bring the waiting loop train back under control (its own block panel, signals and rules)
        function resumeParkedTrain() {
            stopLoopTimers();
            clearPanelsUI();
            const p = parked;
            parked = null;
            state = p.state;
            applyDirectionUI(p.dir);
            if (state.isLCRUnlocked) { btnLCR.classList.add('active'); arrowDisplay.classList.add('arrow-flashing'); }
            btnLoopSignal2.style.display = 'none';
            btnMainHome.disabled = false;
            drawDiagram();
        }

        function setDirection(d) {
            if (state.train.active) return;

            if (parked) {
                if (state.train.hasStarted) {
                    showMessage('মেইন লাইনের ট্রেনটি এখনও স্টেশনে আছে। ট্রেনটি চলে যাওয়ার পর বাটন চাপুন');
                    return;
                }
                if (d === parked.dir) { resumeParkedTrain(); return; }   // back to the train waiting in the loop
                if (d === DIR) return;
                const pts = reorientPoints();
                resetSimulation(true, true);                            // other side: new main-line train from there
                state.loop.left = pts.left; state.loop.right = pts.right;
                clearPanelsUI();
                applyDirectionUI(d);
                drawDiagram();
                return;
            }

            // A train is waiting at the loop starter: it stays where it is, and the pressed button starts a new main-line train
            if (state.train.stoppedAtStr) {
                if (state.loop.left !== 'off') {
                    showMessage('লুপ-' + bn12(loopNo('left')) + ' পয়েন্ট এখনও সেট করা আছে। আগে পয়েন্টের লাইনে ক্লিক করে লুপ-' + bn12(loopNo('left')) + ' পয়েন্ট নরমাল করুন (ফ্ল্যাশিং শেষ হওয়ার পর), তারপর বাটন চাপুন');
                    return;
                }
                const l2 = state.loop2;
                if (state.loop.right !== 'off' || l2.greenA || l2.greenB || state.signals['L1_Adv'].state !== 0 || state.signals['YR_Adv'].state !== 0) {
                    showMessage('লুপ-' + bn12(loopNo('right')) + ' পয়েন্ট / লুপ স্টার্টার সিগনাল দেওয়া আছে। আগে লুপ-' + bn12(loopNo('right')) + ' পয়েন্টের লাইনে ক্লিক করে সেটি নরমাল করুন, তারপর বাটন চাপুন');
                    return;
                }
                parkLoopTrain(d);
                return;
            }

            if (d === DIR) return;
            const pts = reorientPoints();
            resetSimulation(true, true);                // clears the picture and the line clear of the old direction
            state.loop.left = pts.left; state.loop.right = pts.right;   // the points themselves stay where they are
            clearPanelsUI();
            applyDirectionUI(d);
            drawDiagram();
        }

        function resetSimulation(resetArrow = true, keepPoints = false) {
            if (keepPoints) {
                // only the route marking goes back to grey; points that are set stay set until they are normalised by hand
                state.loop.green = false;
                state.loop2 = { greenA: false, greenB: false, redA: false, redB: false };
                btnLoopSignal2.style.display = 'none';
            } else clearLoop();
            state.activeRoute = 'none';
            state.step = 0;
            state.train.active = false;
            state.train.x = -200;
            state.train.hasStarted = false;
            state.train.passedOuter = false;
            state.train.touchedOuter = false;
            state.train.passedHome = false;
            state.train.stoppedAtStarter = false;
            state.train.stoppedAtOuter = false;
            state.train.isReturning = false;
            state.train.passedStarter = false;
            state.train.passedAdv = false;
            state.train.soundPlayed = false;
            
            for (let key in state.signals) { state.signals[key].state = 0; }
            
            state.train.route = 'main';
            state.train.loopRed = { p0: false, p1: false, p2: false, p3: false };
            state.train.seen = [];
            state.train.stoppedAtStr = false;
            state.train.loopPhase = 'in';
            state.train.passedStr = false;

            // Re-enable Home Signal button on Reset
            btnMainHome.disabled = false;

            if (resetArrow) {
                state.isLCRUnlocked = false;
                btnLCR.classList.remove('active');
                arrowDisplay.classList.remove('arrow-flashing');
                arrowDisplay.style.color = '#555';
                if (arrowResetTimeout) clearTimeout(arrowResetTimeout);
            }
            
            drawDiagram();
        }

        document.getElementById('btnReset').addEventListener('click', () => { parked = null; resetSimulation(); });

        // --- Zoom & Pan ---
        function getDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        wrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { isDragging = true; lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY; } 
            else if (e.touches.length === 2) { isDragging = false; startDist = getDistance(e.touches); }
        }, { passive: false });

        wrapper.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - lastTouchX;
                const dy = e.touches[0].clientY - lastTouchY;
                translateX += dx; translateY += dy;
                lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
                applyTransform();
            } else if (e.touches.length === 2) {
                const dist = getDistance(e.touches);
                const newScale = Math.min(Math.max(0.5, scale * (dist / startDist)), 3);
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                translateX = midX - (midX - translateX) * (newScale / scale);
                translateY = midY - (midY - translateY) * (newScale / scale);
                scale = newScale; startDist = dist;
                applyTransform();
            }
        }, { passive: false });

        wrapper.addEventListener('touchend', () => { isDragging = false; });

        wrapper.addEventListener('mousedown', (e) => { isDragging = true; lastTouchX = e.clientX; lastTouchY = e.clientY; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                translateX += e.clientX - lastTouchX; translateY += e.clientY - lastTouchY;
                lastTouchX = e.clientX; lastTouchY = e.clientY; applyTransform();
            }
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.min(Math.max(0.5, scale * zoomFactor), 3);
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
            translateX = mouseX - (mouseX - translateX) * (newScale / scale);
            translateY = mouseY - (mouseY - translateY) * (newScale / scale);
            scale = newScale; applyTransform();
        }, { passive: false });

        function applyTransform() {
            canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            // the LCR panels stay fixed on the screen (they do not zoom / pan with the diagram)
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 200); });
        resizeCanvas();

        function signalAt(clientX, clientY) {

        function isSignalGiven(label) {
            const sg = state.signals;
            if (label === 'Home' || label === 'Outer') return sg['RYG_Home'].state !== 0 || sg['YRYG_Outer'].state !== 0;
            if (label === 'Starter') return sg['RY_Starter'].state !== 0;
            if (label === 'AdvStr') return sg['YR_Adv'].state === 2;

            const arrowBack = () => { if (state.isLCRUnlocked) { arrowDisplay.style.color = '#555'; arrowDisplay.classList.add('arrow-flashing'); } };
            const homeStep1 = () => { sg['YRYG_Outer'].state = 3; sg['RYG_Home'].state = 1; sg['GYR_Home'].state = 2; sg['GYRY_Home'].state = 2; };
            if (label === 'Home' || label === 'Outer') {

        // ---------- Clicking a point (the bent line between the main line and the loop) ----------
        // n = 1: Loop 1 point (where the train enters the loop), n = 2: Loop 2 point (where it leaves), for the selected direction
        function pointAt(clientX, clientY) {
            const r = canvas.getBoundingClientRect();
            const px = (clientX - r.left) * CW / r.width, py = (clientY - r.top) * CH / r.height;
            const tol = 16 * UI;
            for (const pt of pointHits) {
                const g = pt.seg, dx = g.x2 - g.x1, dy = g.y2 - g.y1;
                const t = Math.max(0, Math.min(1, ((px - g.x1) * dx + (py - g.y1) * dy) / (dx * dx + dy * dy)));
                if (Math.hypot(px - (g.x1 + t * dx), py - (g.y1 + t * dy)) <= tol) return pt.n;
            }
            return 0;
        }
        function onPointClicked(n) {
            if (btnMainHome.disabled || state.train.active) return;      // not while a train is running
            const side = ((n === 1) === (DIR === 'up')) ? 'left' : 'right';   // travel-space side of this point for the selected direction
            const v = state.loop[side];
            if (v === 'flash' || v === 'flashOff') return;               // still changing
            const nm = n === 1 ? 'লুপ-১' : 'লুপ-২';
            if (v === 'steady') {
                askYesNo('আপনি কি ' + nm + ' পয়েন্ট নরমাল করতে চান?', () => selectHomeRoute(side === 'left' ? 'loop1normal' : 'loop2normal'));

            }
        }
        const CLICKABLE = ['Home', 'Starter', 'AdvStr', 'STR', 'Outer'];

            if (hit.set !== DIR) {
                showMessage(DIR === 'up'
                    ? 'এই সিগনাল ডাউন ট্রেনের। ডাউন ট্রেন চালাতে হলে আগে উপরে "Down Train" বাটনে ক্লিক করুন'
                    : 'এই সিগনাল আপ ট্রেনের। আপ ট্রেন চালাতে হলে আগে উপরে "Up Train" বাটনে ক্লিক করুন');
                return;
            }
            onSignalClicked(hit.label);
        });
        canvas.addEventListener('pointermove', (e) => {
            const hit = signalAt(e.clientX, e.clientY);
            canvas.style.cursor = ((hit && CLICKABLE.includes(hit.label)) || (!hit && pointAt(e.clientX, e.clientY))) ? 'pointer' : 'default';
        });

        // ---------- MENU popup ----------
        function toggleMenu(e) { if (e) e.stopPropagation(); document.getElementById('menuPanel').classList.toggle('open'); }
        function closeMenu() { document.getElementById('menuPanel').classList.remove('open'); }
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('menuPanel');
            if (!panel.classList.contains('open')) return;
            if (e.target.closest('#menuPanel button') || !e.target.closest('#menuPanel')) closeMenu();   // after a choice, or a tap outside
        });

        // ---------- LCR panels: only the panel of the selected direction works ----------
        [[floatingPanelL, 'down'], [floatingPanel, 'up']].forEach(([el, d]) => {
            el.addEventListener('click', (e) => {
                if (!el.classList.contains('inactive')) return;
                e.stopPropagation(); e.preventDefault();
                showMessage(d === 'down'
                    ? 'এই প্যানেল ডাউন ট্রেনের। ডাউন ট্রেনের কাজ করতে হলে আগে উপরে "Down Train" বাটনে ক্লিক করুন'
                    : 'এই প্যানেল আপ ট্রেনের। আপ ট্রেনের কাজ করতে হলে আগে উপরে "Up Train" বাটনে ক্লিক করুন');
            }, true);
        });
</script>
</body>
</html>
